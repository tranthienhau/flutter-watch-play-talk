<style>

<span class="material-symbols-outlined text-[15px] font-bold">check</span>

<span class="material-symbols-outlined text-[16px] filled">mic</span>

<script>
    // Lightweight micro-interaction for child feedback
    document.addEventListener('DOMContentLoaded', () => {
      const micBtn = document.querySelector('button:has(.material-symbols-outlined[data-mic])') || document.querySelector('button.bg-gradient-to-r');
      if (micBtn) {
        micBtn.addEventListener('click', () => {
          micBtn.classList.add('scale-95');
          setTimeout(() => micBtn.classList.remove('scale-95'), 150);
        });
      }
    });
  </script>
